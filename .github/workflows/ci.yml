name: Validate AI adoption workspace
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/archive/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: airisk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt pip-audit==2.10.1
      - run: python -m unittest discover -s tests -v
      - run: pip-audit -r requirements.txt
      - name: Check migrations
        run: |
          export AIRISK_INSTANCE="$RUNNER_TEMP/airisk-migrations"
          python -m flask --app app db upgrade
          python -m flask --app app db check
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Exercise real browser workflows
        run: |
          export AIRISK_INSTANCE="$RUNNER_TEMP/airisk-browser"
          export AIRISK_SETUP_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          python -m flask --app app db upgrade
          gunicorn --bind 127.0.0.1:5057 --workers 1 --threads 2 'app:create_app()' &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5057/health; then break; fi
            sleep 1
          done
          npm run test:browser
      - name: Exercise HaloITSM browser workflow with simulated API
        run: python tests/halo_browser.py
      - name: Exercise OneTrust and Coupa browser workflows with simulated APIs
        run: python tests/halo_browser.py --enterprise
      - name: Check production container
        run: |
          docker build -t airisk:test .
          export SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          docker run --detach --name airisk-test --env SECRET_KEY -p 127.0.0.1:5058:8080 airisk:test
          trap 'docker logs airisk-test; docker rm -f airisk-test' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5058/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 7
