{% extends 'base.html' %}{% from 'macros.html' import csrf with context %}{% block title %}Account{% endblock %}{% block content %}<section class="panel narrow"><h1>{{ g.user.name }}</h1><p>{{ g.user.email }} · {{ g.user.role }}</p><h2>Change password</h2><form method="post" class="stack">{{ csrf() }}<label>Current password<input name="current_password" type="password" required autocomplete="current-password"></label><label>New password<input name="password" type="password" minlength="12" maxlength="1024" required autocomplete="new-password"></label><button>Change password</button></form></section>{% endblock %}
